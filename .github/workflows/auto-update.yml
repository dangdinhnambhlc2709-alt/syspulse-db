name: Tự động cập nhật thông số thiết bị

on:
  repository_dispatch:
    types: [new-device-detected]
  workflow_dispatch:
    inputs:
      manufacturer:
        description: 'Tên hãng (VD: Xiaomi)'
        required: true
      model:
        description: 'Mã máy (VD: Xiaomi 17 hoặc 25098PN5AC)'
        required: true
      hardware:
        description: 'Mã phần cứng (tùy chọn)'
        required: false

permissions:
  contents: write

concurrency:
  group: update-devices-db
  cancel-in-progress: false

jobs:
  enrich-device:
    runs-on: ubuntu-latest
    steps:
      - name: Tải mã nguồn kho hiện tại
        uses: actions/checkout@v4

      - name: Cài đặt Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cài đặt thư viện Groq và Tavily
        run: pip install groq tavily-python

      - name: Chạy AI tra cứu và cập nhật JSON
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          MANUFACTURER: ${{ github.event.client_payload.manufacturer || github.event.inputs.manufacturer }}
          MODEL: ${{ github.event.client_payload.model || github.event.inputs.model }}
          HARDWARE: ${{ github.event.client_payload.hardware || github.event.inputs.hardware || '' }}
        run: |
          python update_db.py "$MANUFACTURER" "$MODEL" "$HARDWARE"

      - name: Lưu tệp devices_db.json mới lên GitHub
        run: |
          git config user.name "SysPulse Bot"
          git config user.email "bot@syspulse.local"
          git add devices_db.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Tự động thêm thông số: $MODEL" && git push)
